promet:
  title: "Промет"
  photo_api: promet         # ключ — артикул, раздел каталога берётся из
  photo_key: article        # гиперссылок, расставленных поставщиком в книге
  state: on
  prefix: 10
  file: "input/promet/*.xlsx"
  sheets: ["база"]
  header_rows: [1]
  data_starts_at: 2
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Наименование"
    price: "Розничная цена"
  unit_default: "ШТ"
  price_includes_vat: true
  description_template: |
    {name}
    Артикул производителя: {article}

brinex_wheels:
  title: "Бринэкс, автодиски"
  photo_api: brinex          # ключ — «Код товара (goods_id)»
  state: on
  prefix: 11
  file: "input/brinex/*.xlsx"
  sheets: ["Автодиски"]
  header_rows: [6]
  data_starts_at: 8
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    goods_id: "Код товара (goods_id)"   # ключ к API изображений
    name: "Номенклатура"
    price: "Цена"
    stock: "Остаток общий"
    brand: "Производитель"
    model: "Модель"
    rim: "Диаметр"
    width: "Ширина диска"
    pcd: "PCD"
    et: "ЕТ"
    cb: "СВ"
    material: "Материал"
    color: "Описание цвета"
    holes: "Количество отверстий крепежа"
    hole_type: "Тип отверстия"
    weight: "Вес"
    mfr_code: "Код производителя"
  min_stock: 1
  unit_default: "ШТ"
  okpd2_default: "29.32.30.220"   # Колеса, ступицы и их детали
  description_template: |
    {name}
    Производитель: {brand}
    Модель: {model}
    Посадочный диаметр: R{rim}
    Ширина обода: {width}
    Сверловка PCD: {pcd}
    Отверстий крепежа: {holes}
    Тип отверстия: {hole_type}
    Вылет ET: {et}
    Ступичное отверстие DIA: {cb}
    Материал: {material}
    Цвет: {color}
    Вес: {weight} кг
    Артикул производителя: {mfr_code}


