promet:
  title: "Промет"
  photo_api: promet         # ключ — артикул, раздел каталога берётся из
  photo_key: article        # гиперссылок, расставленных поставщиком в книге
  state: on
  prefix: 10
  file: "input/promet/*.xlsx"
  sheets: ["база"]
  header_rows: [1]
  data_starts_at: 2
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Наименование"
    price: "Розничная цена"
  unit_default: "ШТ"
  price_includes_vat: true
  description_template: |
    {name}
    Артикул производителя: {article}

brinex_wheels:
  title: "Бринэкс, автодиски"
  photo_api: brinex          # ключ — «Код товара (goods_id)»
  state: on
  prefix: 11
  file: "input/brinex/*.xlsx"
  sheets: ["Автодиски"]
  header_rows: [6]
  data_starts_at: 8
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    goods_id: "Код товара (goods_id)"   # ключ к API изображений
    name: "Номенклатура"
    price: "Цена"
    stock: "Остаток общий"
    brand: "Производитель"
    model: "Модель"
    rim: "Диаметр"
    width: "Ширина диска"
    pcd: "PCD"
    et: "ЕТ"
    cb: "СВ"
    material: "Материал"
    color: "Описание цвета"
    holes: "Количество отверстий крепежа"
    hole_type: "Тип отверстия"
    weight: "Вес"
    mfr_code: "Код производителя"
  min_stock: 1
  unit_default: "ШТ"
  okpd2_default: "29.32.30.220"   # Колеса, ступицы и их детали
  description_template: |
    {name}
    Производитель: {brand}
    Модель: {model}
    Посадочный диаметр: R{rim}
    Ширина обода: {width}
    Сверловка PCD: {pcd}
    Отверстий крепежа: {holes}
    Тип отверстия: {hole_type}
    Вылет ET: {et}
    Ступичное отверстие DIA: {cb}
    Материал: {material}
    Цвет: {color}
    Вес: {weight} кг
    Артикул производителя: {mfr_code}


brinex_tires:
  title: "Бринэкс, автошины"
  photo_api: brinex
  state: on
  prefix: 12
  file: "input/brinex/*.xlsx"
  sheets: ["Автошины"]
  header_rows: [6]
  data_starts_at: 8
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    goods_id: "Код товара (goods_id)"   # ключ к API изображений
    name: "Номенклатура"
    price: "Цена"
    stock: "Остаток общий"
    brand: "Производитель"
    model: "Модель"
    width: "Ширина"
    height: "Высота"
    rim: "Диаметр"
    season: "Сезонность"
    load_index: "Индекс нагрузки/Индекс нагрузки сдвоенной шины"
    speed_index: "Индекс скорости"
    runflat: "Run Flat"
    studs: "Шипы"
    weight: "Вес"
    mfr_code: "Код производителя"
  min_stock: 1
  unit_default: "ШТ"
  okpd2_default: "22.11.11.000"   # Шины и покрышки пневматические для легковых автомобилей новые
  description_template: |
    {name}
    Производитель: {brand}
    Модель: {model}
    Типоразмер: {width}/{height} R{rim}
    Сезонность: {season}
    Шипы: {studs}
    Индекс нагрузки: {load_index}
    Индекс скорости: {speed_index}
    Run Flat: {runflat}
    Вес: {weight} кг
    Артикул производителя: {mfr_code}


gurinenko_bakaleya:
  photo_api: openfoodfacts   # ключ — штрихкод EAN-13
  photo_key: barcode
  title: "Гуриненко, бакалея"
  state: on
  prefix: 13
  file: "input/gurinenko_bakaleya/*.xlsx"
  sheets: ["Лист_1"]
  header_rows: [1, 2]
  data_starts_at: 3
  row_is_product: price_not_empty
  columns:
    barcode: "Штрихкод"
    name: "Номенклатура"
    price: "Цена клиента"
    stock: "Остаток"
  min_stock: 1
  unit_default: "ШТ"
  description_template: "{name}"

gurinenko_grushevo:
