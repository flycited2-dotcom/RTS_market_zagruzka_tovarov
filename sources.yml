    "Посудомоечные машины встраиваемые": "27.51.12.000" # Машины посудомоечные бытовые
    "Сушильные автоматы": "27.51.13.120"                # Машины сушильные бытовые
    "Электрические плиты": "27.51.28.130"               # Плиты кухонные электрические
    "Духовки настольные": "27.51.28.110"                # Печи бытовые электрические
