opt:
  title: "Прайс-лист ОПТ"
  # Ритуальные материалы не выгружаются: это не изделия, а сырьё для их
  # сборки — ветки, головы бутонов, ленты, каркасы. Средняя цена 98 рублей,
  # половина дешевле сотни, фотографий у них нет и не будет.
  # Списки точные, а не по первому слову: «Внутренний блок» и «Наружный
  # блок» — это сплит-системы MDV, а «Лента тефлоновая AVIORA» — сантехника.
  exclude_name_starts:
    - "Ветка"
    - "Голова"
    - "Каркас для"
    - "Сетка люрекс"
    - "Лист хвост"
    - "Лента КОРОНА"
    - "Лента в катушке"
    - "Лента зол"
    - "Лента металл"
    - "Лента простая"
    - "Лента с "
    - "Лента траурная"
  state: on
  prefix: 15
  file: "input/opt/*.xlsx"
  sheets: ["Лист_1"]
  header_rows: [3, 4]
  data_starts_at: 5
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Номенклатура"
    price: "Закуп Цена"
    stock: "Склад основной ООО Остаток"
  unit_default: "ШТ"
  description_template: "{name}"

priceopt:
  title: "Посуда и кухня"
  # Коды выверены по reference/okpd2.csv дословно: каждый существует в
  # официальном справочнике. Разметка нужна потому, что без неё площадка
  # подбирает код сама и мимо — пюре она предложила записать как «Чай
  # чёрный», кондиционер для белья как «Кондиционеры бытовые».
  # Разбор и обоснование — docs/окпд2-чего-не-хватает.md
