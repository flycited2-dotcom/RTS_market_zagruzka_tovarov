promet:
  title: "Промет"
  state: on
  prefix: 10
  file: "input/promet/*.xlsx"
  sheets: ["база"]
  header_rows: [1]
  data_starts_at: 2
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Наименование"
    price: "Розничная цена"
  unit_default: "ШТ"
  price_includes_vat: true
  description_template: |
    {name}
    Артикул производителя: {article}

brinex_wheels:
  title: "Бринэкс, автодиски"
  state: on
  prefix: 11
  file: "input/brinex/*.xlsx"
  sheets: ["Автодиски"]
  header_rows: [6]
  data_starts_at: 8
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Номенклатура"
    price: "Цена"
    stock: "Остаток общий"
    brand: "Производитель"
    diameter: "Диаметр"
  min_stock: 1
  okpd2_default: "29.32.30.220"   # Колеса, ступицы и их детали
  unit_default: "ШТ"
  description_template: |
    {name}
    Производитель: {brand}
    Диаметр: {diameter}
    Артикул производителя: {article}

brinex_tires:
  title: "Бринэкс, автошины"
  state: on
  prefix: 12
  file: "input/brinex/*.xlsx"
  sheets: ["Автошины"]
  header_rows: [6]
  data_starts_at: 8
  row_is_product: price_not_empty
  columns:
    article: "Артикул"
    name: "Номенклатура"
    price: "Цена"
    stock: "Остаток общий"
    brand: "Производитель"
    width: "Ширина"
  min_stock: 1
  okpd2_default: "22.11.11.000"   # Шины и покрышки пневматические для легковых автомобилей новые
  unit_default: "ШТ"
  description_template: |
    {name}
    Производитель: {brand}
    Ширина профиля: {width}
    Артикул производителя: {article}

gurinenko_bakaleya:
  title: "Гуриненко, бакалея"
  state: on
  prefix: 13
  file: "input/gurinenko_bakaleya/*.xlsx"
  sheets: ["Лист_1"]
  header_rows: [1, 2]
  data_starts_at: 3
  row_is_product: price_not_empty
  columns:
    barcode: "Штрихкод"
    name: "Номенклатура"
    price: "Цена клиента"
    stock: "Остаток"
  min_stock: 1
  unit_default: "ШТ"
  description_template: "{name}"

gurinenko_grushevo:
  title: "Гуриненко, Грушево"
  state: on
  prefix: 14
  file: "input/gurinenko_grushevo/*.xlsx"
  sheets: ["Лист_1"]
  header_rows: [2, 3]
  data_starts_at: 4
  row_is_product: price_not_empty
  columns:
    barcode: "Штрихкод"
    name: "Номенклатура"
    price: "Цена клиента"
  unit_default: "ШТ"
  description_template: "{name}"

opt:
  title: "Прайс-лист ОПТ"
  state: on
  prefix: 15
