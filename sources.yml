    "Ножи и кухонные аксессуары": "25.71.11.110"        # Ножи (кроме ножей для машин)
    "Столовые приборы": "25.71.14.110"                  # Ложки, вилки, половники, шумовки
    "Посуда для приготовления": "25.99.12.112"          # Изделия кухонные из нержавеющей стали
    "Термопосуда": "25.99.12.112"
    "Термосы": "25.99.12.112"
    "Чайники и заварочные чайники": "25.99.12.112"
    "Емкости для хранения продуктов": "22.29.23.110"    # Посуда кухонная пластмассовая
    "Кухонные мойки": "25.99.11.112"                    # Раковины из нержавеющей стали
    "Кухонные смесители": "28.14.12.110"                # Краны, клапаны для раковин и моек
    "Кондиционеры он/офф": "28.25.12.130"               # Кондиционеры бытовые
    "Кондиционеры инверторные": "28.25.12.130"
    "Электрочайники": "27.51.24.110"                    # Электрочайники
    "Кофеварки, кофемашины": "27.51.24.120"             # Электрокофеварки
    "Микроволновые печи": "27.51.27.000"                # Печи микроволновые
    "Вытяжки": "27.51.15.120"                           # Шкафы вытяжные бытовые
    "Вытяжки встраиваемые": "27.51.15.120"
    "Поверхности газовые": "27.52.11.110"               # Плиты газовые бытовые
    "Плиты с газовой духовкой": "27.52.11.110"
    "Поверхности электрические": "27.51.28.160"         # Панели варочные электрические
    "Плитки настольные": "27.51.28.130"                 # Плиты кухонные электрические
    "Духовые шкафы": "27.51.28.110"                     # Печи бытовые электрические
    "Телевизоры 46\" и более": "26.40.20.122"           # Телевизоры с ЖК-экраном
    "Утюги и гладильные системы": "27.51.23.130"        # Утюги электрические
    "Водонагреватели накопительные": "27.51.25.110"     # Водонагреватели электрические
    "Холодильники с нижней морозильной камерой": "27.51.11.110"   # Холодильники бытовые
    "Стиральные машины с фронтальной загрузкой": "27.51.13.110"   # Машины стиральные бытовые
    "Мясорубки": "27.51.21.122"                         # Электромясорубки
    "Пылесосы колбовые": "27.51.21.111"                 # Пылесосы бытовые
    "Миксеры": "27.51.21.190"                           # Приборы электромеханические прочие
